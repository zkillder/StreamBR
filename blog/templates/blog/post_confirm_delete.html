{% extends 'blog/base.html' %}
{% block title %}Excluir Artigo — StreamBR{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div style="background:var(--dark-card); border:1px solid var(--live-red); border-radius:16px; overflow:hidden;">
                <div style="background:rgba(255, 71, 71, 0.1); padding:1.5rem 2rem; border-bottom:1px solid rgba(255, 71, 71, 0.3);">
                    <h4 class="mb-0 text-danger" style="font-family:'Rajdhani',sans-serif; font-weight:700;">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>Confirmar Exclusão
                    </h4>
                </div>
                <div class="p-4 p-md-5 text-center">
                    <i class="bi bi-trash3 text-danger mb-3 d-block" style="font-size: 3rem;"></i>
                    <p class="text-muted-custom">Você tem certeza que deseja deletar este artigo?</p>
                    <h5 class="fw-bold mb-4 text-light">"{{ post.title }}"</h5>
                    <p class="small text-danger mb-4">Esta ação é irreversível.</p>
                    <div class="d-flex justify-content-center gap-3">
                        <form method="post">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-danger px-4 py-2" style="border-radius:8px;">
                                <i class="bi bi-trash me-1"></i> Sim, Excluir
                            </button>
                        </form>
                        <a href="{% url 'post_detail' post.slug %}" class="btn-outline-twitch">
                            Cancelar
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
